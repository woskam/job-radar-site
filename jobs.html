<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>12GetAJob Jobs</title>
  <meta name="description" content="Search live job listings by keyword, category, segment, and location -- and get a daily email when new ones match.">
  <link rel="canonical" href="https://12getajob.com/jobs">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/analytics.js"></script>
</head>
<body>
  <div class="hero">
    <div class="hero-inner">
      <header class="site-header">
        <a href="/">12GetAJob</a>
        <nav>
          <a href="/jobs">Jobs</a>
          <a href="/companies">Companies</a>
          <a href="/alerts">Alerts</a>
          <a href="/developers">For developers</a>
        </nav>
      </header>

      <h1>Find your next job</h1>
      <p class="tagline">Search live listings, then save the search as a daily email alert.</p>

      <div class="filters">
        <input type="search" id="q" placeholder="Job title or keyword&hellip;">
        <select id="category-filter"><option value="">Any category</option></select>
        <select id="segment-filter">
          <option value="">Any segment</option>
          <option value="startup">Startups &amp; scale-ups</option>
        </select>
        <div style="display:flex; gap:8px; flex:1 1 220px;">
          <input type="text" id="location" placeholder="Location">
          <label style="display:flex; align-items:center; gap:6px; font-size:14px; white-space:nowrap;">
            <input type="checkbox" id="remote-only"> Remote
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <p id="result-count" class="tagline" style="margin:0;">Loading&hellip;</p>
      <a id="alert-link" href="/alerts">Get alerts for this search &rarr;</a>
    </div>

    <div id="results"></div>

    <div class="pagination">
      <button id="prev-page">&larr; Previous</button>
      <span id="page-indicator"></span>
      <button id="next-page">Next &rarr;</button>
    </div>

    <footer>
      <a href="https://github.com/woskam/job-radar">job-radar</a> ·
      <a href="https://github.com/woskam/job-radar-hub">job-radar-hub</a> ·
      <a href="https://github.com/woskam/job-radar-site">this site's source</a> ·
      <a href="/privacy">privacy</a>
    </footer>
  </div>

  <script>
    const CATEGORIES = ["ai_ml","b2b","banking","beauty","climate","consulting","consumer","crypto","devtools","ecommerce","education","enterprise","fashion","fintech","fmcg","government","healthcare","healthtech","industrials","insurance","marketplace","mobility","other","overheid","pharma","real_estate_and_construction","resilience","saas","semiconductor","sportswear","staffing","tech","telecom"];
    const categorySelect = document.getElementById('category-filter');
    for (const c of CATEGORIES) {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      categorySelect.appendChild(opt);
    }

    const PAGE_SIZE = 20;
    let offset = 0;

    const q = document.getElementById('q');
    const segmentFilter = document.getElementById('segment-filter');
    const locationInput = document.getElementById('location');
    const remoteOnly = document.getElementById('remote-only');
    const resultsEl = document.getElementById('results');
    const countEl = document.getElementById('result-count');
    const pageIndicator = document.getElementById('page-indicator');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const alertLink = document.getElementById('alert-link');

    function currentFilters() {
      return {
        title_contains: q.value.trim(),
        category: categorySelect.value,
        segment: segmentFilter.value,
        location_contains: remoteOnly.checked ? 'remote' : locationInput.value.trim(),
      };
    }

    function updateAlertLink() {
      const f = currentFilters();
      const params = new URLSearchParams();
      if (f.title_contains) params.set('keywords', f.title_contains);
      if (f.category) params.set('category', f.category);
      if (f.segment) params.set('segment', f.segment);
      if (remoteOnly.checked) params.set('location_mode', 'remote');
      else if (f.location_contains) params.set('location_mode', f.location_contains);
      alertLink.href = '/alerts' + (params.toString() ? '?' + params.toString() : '');
    }

    function renderResults(data) {
      resultsEl.innerHTML = '';
      if (!data.results.length) {
        resultsEl.innerHTML = '<p class="tagline">No matching listings right now -- try widening the filters.</p>';
      }
      for (const job of data.results) {
        const card = document.createElement('div');
        card.className = 'job-card';
        const badges = [job.category, job.segment].filter(Boolean)
          .map((b) => `<span class="badge">${b}</span>`).join('');
        card.innerHTML = `
          <h3><a href="${job.url}" target="_blank" rel="noopener">${job.title || '(untitled)'}</a></h3>
          <div class="meta">${job.company || ''}${job.location ? ' &middot; ' + job.location : ''}</div>
          <div class="badges">${badges}</div>
        `;
        resultsEl.appendChild(card);
      }
      countEl.textContent = `${data.count} result${data.count === 1 ? '' : 's'} on this page`;
      pageIndicator.textContent = `Page ${Math.floor(offset / PAGE_SIZE) + 1}`;
      prevBtn.disabled = offset === 0;
      nextBtn.disabled = data.count < PAGE_SIZE;
    }

    async function search() {
      countEl.textContent = 'Loading…';
      const f = currentFilters();
      const params = new URLSearchParams({ limit: PAGE_SIZE, offset });
      for (const [k, v] of Object.entries(f)) if (v) params.set(k, v);

      try {
        const resp = await fetch('/api/jobs?' + params.toString());
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'request failed');
        renderResults(data);
      } catch {
        countEl.textContent = 'Could not load listings, try again shortly.';
      }
      updateAlertLink();
    }

    let debounceTimer;
    function searchFromStart() {
      offset = 0;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(search, 250);
    }

    q.addEventListener('input', searchFromStart);
    categorySelect.addEventListener('change', searchFromStart);
    segmentFilter.addEventListener('change', searchFromStart);
    locationInput.addEventListener('input', searchFromStart);
    remoteOnly.addEventListener('change', searchFromStart);
    prevBtn.addEventListener('click', () => { offset = Math.max(0, offset - PAGE_SIZE); search(); });
    nextBtn.addEventListener('click', () => { offset += PAGE_SIZE; search(); });

    // Prefill from query params (e.g. arriving from a link elsewhere).
    const initial = new URLSearchParams(window.location.search);
    if (initial.get('keywords')) q.value = initial.get('keywords');
    if (initial.get('category')) categorySelect.value = initial.get('category');
    if (initial.get('segment')) segmentFilter.value = initial.get('segment');
    if (initial.get('location_mode') === 'remote') remoteOnly.checked = true;
    else if (initial.get('location_mode')) locationInput.value = initial.get('location_mode');

    search();
  </script>
</body>
</html>
